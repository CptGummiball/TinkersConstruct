/*
 * Tinkers' Construct — Fabric 1.21.1
 * GummiCraft-specific build. Not intended for upstream contribution.
 *
 * Original: Slime Knights (Forge). Fabric port maintained in CptGummiball/TinkersConstruct.
 */
plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = "${minecraft_version}-${mod_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version)) }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { name = 'Fabric';        url = 'https://maven.fabricmc.net/' }
    maven { name = 'Fuzs';          url = 'https://maven.fuzs.net/' }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    maven { name = 'Ladysnake';     url = 'https://maven.ladysnake.org/releases' }
    maven { name = 'BlameJared';    url = 'https://maven.blamejared.com' }
    maven { name = 'Architectury';  url = 'https://maven.architectury.dev/' }
    maven { name = 'Shedaniel';     url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'CurseMaven'; url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'; url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

/*
 * ---------------------------------------------------------------------------
 * Incremental port gate
 * ---------------------------------------------------------------------------
 * The 1.20.1/Forge tree is 1905 files. Porting it in one shot means the build
 * is red for the whole duration and nothing can be verified. Instead only the
 * packages listed in `ported.gradle` are handed to javac; each finished module
 * gets appended there, so every step ends on a compiling, testable build.
 *
 * Run with -Pport.all=true to attempt a full compile of everything.
 */
// An empty include list would mean "no filter" to Gradle, i.e. compile everything —
// the opposite of what an empty gate means here. Map it to a pattern matching nothing.
def readGate = { File f ->
    if (!f.exists()) return ['**']
    def patterns = f.readLines()
            .collect { it.replaceAll('#.*', '').trim() }
            .findAll { !it.isEmpty() }
    return patterns.isEmpty() ? ['.unported-placeholder/**'] : patterns
}

def portedPatterns = readGate(file('ported.gradle'))
def portedTestPatterns = readGate(file('ported-tests.gradle'))
if (project.hasProperty('port.all')) {
    portedPatterns = ['**']
    portedTestPatterns = ['**']
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            include portedPatterns
        }
        resources {
            srcDirs = ['src/main/resources', 'src/generated/resources']
            exclude '.cache'
            exclude 'assets/tconstruct/debug'
            // Forge-only metadata; Fabric uses fabric.mod.json + accesswidener
            exclude 'META-INF/mods.toml'
            exclude 'META-INF/accesstransformer.cfg'
        }
    }
    // Tests exercise the Forge/1.20.1 tree and are ported alongside it; gate them the
    // same way so `build` stays runnable while the port is in progress.
    test {
        java {
            srcDirs = ['src/test/java']
            include portedTestPatterns
        }
    }
}

loom {
    accessWidenerPath = file('src/main/resources/tconstruct.accesswidener')
    runs {
        client { client(); ideConfigGenerated true; runDir 'run' }
        server { server(); ideConfigGenerated true; runDir 'run/server' }
        datagen {
            inherit server
            name 'Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources')}"
            vmArg '-Dfabric-api.datagen.modid=tconstruct'
            runDir 'build/datagen'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Official Mojang mappings — keeps the existing net.minecraft.* references in
    // the ported sources valid. Yarn would require renaming all 187k lines.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // JSR-305 annotations: Forge supplied these transitively, Fabric does not.
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    // The existing test tree mocks registries heavily; kept available for ported tests.
    testImplementation 'org.mockito:mockito-core:5.11.0'
}

test { useJUnitPlatform() }

processResources {
    def props = [
        version          : project.version,
        mod_version      : project.mod_version,
        loader_range     : project.loader_range,
        minecraft_range  : project.minecraft_range,
        fabric_api_range : project.fabric_api_range,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
    // The port is large; do not let warning volume hide real errors.
    options.compilerArgs << '-Xlint:-deprecation' << '-Xlint:-unchecked'
}

jar {
    from('LICENSE') { rename { "${it}_${base.archivesName.get()}" } }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) { from components.java }
    }
    repositories {
        if (project.hasProperty('DEPLOY_DIR')) { maven { url DEPLOY_DIR } }
    }
}
