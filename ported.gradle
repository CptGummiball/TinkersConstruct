# --- Phase 5: the custom-geometry model bridge ---
# Replaces Forge's patched model deserializer: a "loader" key in a model JSON now dispatches
# through a Fabric ModelResolver instead. The shim interfaces mirror the Forge ones, so the
# geometry classes port by import swap. Also holds the mantle model support classes the geometry
# needs; upstream Mantle's client model package was never copied into this tree, so they are
# written here as the consumers require them (SimpleBlockModel and BakedModelWrapper so far).
slimeknights/mantle/client/model/**
# UniqueGuiModel is the one geometry consumer whose support is complete. The other six in this
# package stay out: each carries a PORT note listing the Forge model utilities (ModelData,
# IQuadTransformer, UnbakedGeometryHelper, CompositeModel, ...) and the absent Mantle model
# classes it still waits on. TinkerModelLoaders holds the id -> loader registrations.
slimeknights/tconstruct/library/client/model/UniqueGuiModel.java
slimeknights/tconstruct/library/client/model/TinkerModelLoaders.java
slimeknights/tconstruct/library/client/model/package-info.java

