# --- Phase 5: the custom-geometry model bridge ---
# Replaces Forge's patched model deserializer: a "loader" key in a model JSON now dispatches
# through a Fabric ModelResolver instead. The shim interfaces mirror the Forge ones, so the
# geometry classes port by import swap. Also holds the mantle model support classes the geometry
# needs; upstream Mantle's client model package was never copied into this tree, so they are
# written here as the consumers require them: SimpleBlockModel, ColoredBlockModel,
# MantleItemLayerModel, RetexturedModel, ExtraTextureContext, DynamicBakedWrapper, ModelHelper,
# plus shims for ModelData/ModelProperty, IQuadTransformer/QuadTransformers, CompositeModel,
# SimpleModelState, UnbakedGeometryHelper and StandaloneGeometryBakingContext.
