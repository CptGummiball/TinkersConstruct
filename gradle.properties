# Tinkers' Construct — Fabric 1.21.1 (GummiCraft build)
# Memory: Loom decompile + 187k LOC compile needs headroom
org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true
org.gradle.daemon=false

mod_version=3.11.2
maven_group=slimeknights.tconstruct
archives_base_name=TinkersConstruct-Fabric

# Minecraft / Fabric — pinned to the GummiCraft target
minecraft_version=1.21.1
minecraft_range=>=1.21.1 <1.21.2
# Mojang official mappings are used (NOT yarn) so the ported Minecraft
# references in the 1.20.1 sources stay valid.
loader_version=0.17.3
loader_range=>=0.16.0
fabric_api_version=0.116.15+1.21.1
fabric_api_range=>=0.116.0

java_version=21

# --- Compat dependencies present in GummiCraft ---
# Forge Config API Port: supplies net.minecraftforge.common.ForgeConfigSpec on Fabric,
# which lets the existing Config class port over near-unchanged.
forge_config_api_port_version=21.1.6
# Recipe viewer: the pack ships EMI, not JEI.
emi_version=1.1.24+1.21.1
# Tooltip/probe: the pack ships Jade, not TOP.
jade_version=15.10.5+fabric
# Accessories / components / energy
trinkets_version=3.10.0
cardinal_components_version=6.1.3
team_reborn_energy_version=4.1.0
patchouli_version=1.21.1-93-FABRIC
architectury_version=13.0.11
